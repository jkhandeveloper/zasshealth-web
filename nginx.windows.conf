# Run nginx.exe from its installation directory with -c pointing to this file.
worker_processes 1;
events { worker_connections 1024; }
http {
    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        root "C:/Users/Mr Mian/Desktop/Zass Health/out";
        index index.html;
        error_page 404 /404.html;
        location = /404.html { internal; }
        add_header X-Content-Type-Options nosniff always;
        location / { try_files $uri $uri/ =404; }
        location ~ /\. { deny all; }
    }
}
